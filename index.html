<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HemoCheck</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <div class="header">
        <h1>🩸 HemoCheck</h1>
        <p>Smart Anemia Screening</p>
    </div>


    <div class="card">

        <h2>Patient Data</h2>

        <label>👤 Gender</label>
        <div class="gender">
            <label>
                <input type="radio" name="gender" value="male">
                Male
            </label>

            <label>
                <input type="radio" name="gender" value="female">
                Female
            </label>
        </div>


        <label>🩸 Hemoglobin (Hb)</label>
        <input type="number" id="hb" step="0.1" placeholder="Enter Hb value">


        <label>🔬 MCV</label>
        <input type="number" id="mcv" placeholder="Enter MCV value">


        <button id="analyzeBtn">
            Analyze →
        </button>


        <button id="saveBtn" class="save">
            Save Patient
        </button>

    </div>


    <div class="result-card">

        <h2>Result</h2>

        <p id="result">
            Waiting for analysis...
        </p>

    </div>


</div>


<script src="script.js"></script>

</body>
</html>
